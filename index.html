<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Followmont SmartRoster</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#142d43;font:16px system-ui,sans-serif}header{background:#102d45;color:white;padding:24px}header small{letter-spacing:3px}h1{margin:5px 0}main,nav{max-width:800px;margin:auto;padding:16px}nav{display:flex;gap:10px}button,select{font:inherit;border-radius:9px;padding:13px;min-height:46px}button{border:0;background:#b32135;color:white;font-weight:600;cursor:pointer;width:100%}nav button{background:#dce5ed;color:#102d45}nav button.active{background:#b32135;color:white}section{background:white;border:1px solid #dce3eb;border-radius:14px;padding:20px;margin-bottom:14px}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5}label{display:block;margin:14px 0 6px;font-weight:600}select{width:100%;border:1px solid #aab8c5;background:white;color:#142d43}section button{margin-top:14px}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#e2f3e8;color:#17613c;font-size:13px}.warn{background:#fff0db;color:#854d0e}.muted,footer{color:#64748b;font-size:13px}footer{text-align:center;padding:20px}.result{border-left:4px solid #28774d;padding-left:14px;margin:20px 0}.stats{display:flex;gap:10px}.stats div{flex:1;background:#eef2f6;padding:12px;border-radius:8px}.stats b{display:block;font-size:25px}</style></head><body><header><small>FOLLOWMONT</small><h1>SmartRoster</h1>Smarter workforce planning</header><nav><button id="emp" onclick="mode='employee';render()">Employee</button><button id="mgr" onclick="mode='manager';render()">Manager</button></nav><main id="app"></main><footer>Student concept prototype · Fictional data · Simulated AI · Not an official Followmont product</footer><script>let mode='employee',shift='Day shifts',duty='Current driving duties',fatigue=false,saved=false,generated=false,approved=false,approvedRole='',approvedHours='';const shifts=['Day shifts','Flexible shifts','Shorter shifts'],duties=['Current driving duties','Less physically demanding duties','Mentoring and training'];const role=()=>duty===duties[1]?'Dispatch support':duty===duties[2]?'Driver mentor':'Delivery driver';const hours=()=>shift===shifts[2]?'Monday · 7 AM – 11 AM':'Monday · 7 AM – 3 PM';const opts=(a,v)=>a.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('');function reset(){generated=false;approved=false}function save(){shift=document.getElementById('shift').value;duty=document.getElementById('duty').value;saved=true;reset();render()}function report(){fatigue=!fatigue;reset();render()}function interest(){duty=duties[1];saved=true;reset();render()}function generate(){generated=true;approved=false;render()}function approve(){if(!fatigue&&generated){approved=true;approvedRole=role();approvedHours=hours();render()}}function render(){document.getElementById('emp').className=mode==='employee'?'active':'';document.getElementById('mgr').className=mode==='manager'?'active':'';document.getElementById('app').innerHTML=mode==='employee'?'<section><h2>David Morgan</h2><p>58 years old · 24 years of experience</p><span class="tag">Active employee</span><p>Brisbane depot · Heavy vehicle driver</p><p class="muted">Verified HC licence · Dispatch · Mentoring · Route planning</p></section><section><h2>My upcoming shift</h2><b>'+(fatigue?'Safety review required':approvedRole||'Delivery driver')+'</b><p>'+(fatigue?'Contact your supervisor before working':approvedHours||'Monday · 7 AM – 3 PM')+'</p></section><section><h2>My work preferences</h2><label for="shift">Preferred working hours</label><select id="shift">'+opts(shifts,shift)+'</select><label for="duty">Preferred duties</label><select id="duty">'+opts(duties,duty)+'</select><button onclick="save()">Save preferences</button>'+(saved?'<p class="tag">Preferences saved</p>':'')+'</section><section><h2>Health & wellbeing</h2><p>Feeling fatigued or concerned about working safely?</p>'+(fatigue?'<p class="tag warn">Fatigue reported. Supervisor review required.</p>':'')+'<button onclick="report()">'+(fatigue?'Withdraw report':'Report fatigue')+'</button></section><section><h2>Explore alternative roles</h2><b>Dispatch support</b><p>Use your transport experience in a less physically demanding role.</p><button onclick="interest()">Express interest</button></section>':'<section><h2>Workforce dashboard</h2><div class="stats"><div><b>3</b>Employees</div><div><b>'+(fatigue?1:0)+'</b>Safety flags</div><div><b>'+(duty===duties[0]?0:1)+'</b>Role requests</div></div></section><section><h2>AI-assisted rostering</h2><p>Match employees using verified skills, licences, work preferences and safety requirements.</p><button onclick="generate()">Generate recommended roster</button></section>'+(generated?'<section><h2>Recommended allocations</h2><div class="result"><b>David Morgan</b><p>'+(fatigue?'Allocation on hold':role())+'</p><span class="tag '+(fatigue?'warn':'')+'">'+(fatigue?'Supervisor review required':'Suitable match')+'</span><p>'+ (fatigue?'Reported fatigue takes priority over allocation.':duty===duties[0]?'Verified HC licence and driving experience.':'Matches transferable skills and updated work preferences.')+'</p><p class="muted">'+shift+' · '+hours()+'</p></div><div class="result"><b>Sarah Chen · 56</b><p>Linehaul driver</p><span class="tag">Suitable match</span><p>Verified MC licence and linehaul experience.</p></div><div class="result"><b>Michael Brown · 61</b><p>Warehouse coordination</p><span class="tag">Suitable match</span><p>Inventory and team coordination skills.</p></div>'+(fatigue?'<p class="tag warn">Approval blocked pending safety review.</p>':'<button onclick="approve()">'+(approved?'✓ Roster approved':'Approve recommended roster')+'</button>')+'</section>':'')+'<section><h2>Employee insights</h2><b>David Morgan</b><p>'+shift+' · '+duty+'</p><span class="tag '+(fatigue?'warn':'')+'">'+(fatigue?'Fatigue reported':'No reported fatigue')+'</span></section><section><h2>Responsible AI</h2><p>Age alone does not determine suitability. Managers retain final decision-making authority. Actual fatigue compliance and staffing constraints require validation before deployment.</p></section>'}render();</script></body></html>
